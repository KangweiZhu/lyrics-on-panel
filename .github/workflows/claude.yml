name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      # Let the triggering comment choose the model, e.g.
      #   @claude model=opus review this
      #   @claude use sonnet for a quick pass
      # Falls back to the action's default when no model is named.
      # The body is passed through env, never interpolated into the script,
      # so comment text cannot be executed as shell.
      - name: Select model from the triggering text
        id: pick
        env:
          BODY: >-
            ${{ github.event.comment.body
                || github.event.review.body
                || github.event.issue.body }}
        run: |
          body=$(printf '%s' "$BODY" | tr '[:upper:]' '[:lower:]')
          case "$body" in
            *opus*)   args='--model claude-opus-5' ;;
            *sonnet*) args='--model claude-sonnet-5' ;;
            *fable*)  args='--model claude-fable-5-1' ;;
            *haiku*)  args='--model claude-haiku-4-5-20251001' ;;
            *)        args='' ;;
          esac
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "claude_args -> ${args:-(action default)}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # Check out a detached HEAD rather than a real local branch.
          # A fork PR opened from the fork's own `main` makes the action run
          # `git fetch origin pull/<N>/head:main`, which git refuses while `main`
          # is the branch checked out on the runner.
          # See https://github.com/anthropics/claude-code-action/issues/1423
          ref: ${{ github.sha }}

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Model chosen by the triggering comment; empty means the action default.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: ${{ steps.pick.outputs.args }}

