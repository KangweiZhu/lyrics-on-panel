name: Test Arch Linux Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'backend-rust/**'
      - 'scripts/**'
      - '.github/workflows/test-arch.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'backend-rust/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  test-arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm base-devel cmake curl dbus git glib2 pkgconf rust

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Python backend dependencies
        working-directory: backend
        run: |
          source $HOME/.local/bin/env
          uv venv --python 3.13.11
          source .venv/bin/activate
          uv pip install websockets==15.0.1 dbus-python==1.4.0

      - name: Smoke test Python backend
        working-directory: backend
        run: |
          source .venv/bin/activate
          timeout 10 python src/server.py || [ $? -eq 124 ]

      - name: Check Rust backend
        working-directory: backend-rust
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo build --release --locked --all-features

      - name: Check installer syntax
        run: bash -n scripts/install-backend.sh scripts/uninstall-backend.sh scripts/install-local-rust-backend.sh
